name: Build macOS PKG

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-pkg:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: check and install
        run: |
          /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          brew install python@3.13 gstreamer gst-plugins-base glib pixman meson ninja phodav opus jpeg-turbo openssl libusb gettext cyrus-sasl
          meson --version
          ninja --version
          python3.13 --version
          /opt/homebrew/bin/python3.13 -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt
          pip install pyparsing
          export PKG_CONFIG_PATH="/opt/homebrew/opt/cyrus-sasl/lib/pkgconfig:$PKG_CONFIG_PATH"
          pkg-config --modversion libsasl2
          pkg-config --libs libsasl2

      
      - name: spicy-build
        run: |
          source venv/bin/activate
          unzip spice-full.zip
          cp makefiles/Makefile spice-full
          cp makefiles/meson.build-gtk-tools spice-full/spice-gtk/tools/meson.build 
          cp makefiles/spicy.c spice-full/spice-gtk/tools/
          cd spice-full
          export PKG_CONFIG_PATH="/opt/homebrew/opt/cyrus-sasl/lib/pkgconfig:$PKG_CONFIG_PATH"
          mkdir -p build/spice/usr/share/locale/ru/LC_MESSAGES
          make 

      - name: build-client
        run: |
          source venv/bin/activate
          ./rebuild.sh
          pip install nuitka ordered-set zstandard imageio
          pyside6-deploy -c pysidedeploy.windows.spec

      - name: update stage
        run: |
          echo "check PWD"
          pwd
          ls -la
          echo "check dist-win"
          ls -lh dist-win/GorizontVS-VDI.app
          file dist-win/GorizontVS-VDI.app
          ls -lh spice-full/build/spice/opt
          cp -vr spice-full/build/spice/opt/homebrew/* stage-macOS/component/payload/GorizontVS-VDI.app/Contents/Resources/spice/


      - name: Show stage content
        run: |
          find stage-macOS -type f
          ls -la

      - name: Build component package
        run: |
          mkdir -p build

          pkgbuild \
            --root stage-macOS/component/payload \
            --scripts stage-macOS/pkgscripts \
            --identifier ru.gorizont.vdi \
            --version 1.8 \
            build/GorizontVS-VDI-Client-Setup.pkg

      - name: Verify package
        run: |
          pkgutil --check-signature build/GorizontVS-VDI-Client-Setup.pkg || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GorizontVS-VDI-pkg
          path: build/GorizontVS-VDI-Client-Setup.pkg
